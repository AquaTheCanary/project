<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launching Present Studio | Project</title>
<script src="../../assets/files/router.js?v=20261124-2"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../../assets/files/auth-config.js?v=20261124-2"></script>
<style>body{margin:0;background:#f5f6fa;color:#252638;font:15px Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.box{background:white;border:1px solid #e6e8ef;border-radius:14px;padding:28px;max-width:360px;text-align:center}.box img{width:54px;height:54px;margin-bottom:12px}.muted{color:#73788a;font-size:13px}</style><link rel="stylesheet" href="../../assets/files/design-system.css"><link rel="stylesheet" href="/assets/files/production-ui.css?v=20261124-2">
<link rel="stylesheet" href="/assets/files/project-reference-ui.css?v=20261124-3">
</head>
<body><main class="box"><img src="../../assets/images/project-present.svg" alt="Project Present"><h2>Opening Present Studio…</h2><p class="muted" id="status">Preparing your interactive workspace.</p></main>
<script>
(async()=>{const status=document.getElementById("status");try{
 const user=await window.studioAuth.currentUser(),guest=new URLSearchParams(location.search).get("guest")==="1";
 if(!user&&!guest){location.replace(window.getAppUrl("/guest/present/"));return;}
 const params=new URLSearchParams(location.search);
 const key=user?"studio_projects_"+user.uid:"",projects=[];
 if(user){try{const saved=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(saved))projects.push(...saved)}catch(_){}}
 let id=params.get("id");if(!id){const used=new Set(projects.map(x=>String(x.id)));do{id=String(Math.floor(100000+Math.random()*900000));}while(used.has(id));}
 if(user){localStorage.setItem("studio_active_project",id);if(!projects.some(p=>p.id===id))projects.unshift({id,title:"Untitled presentation",updatedAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(projects.slice(0,100)));}
 location.replace(window.getAppUrl("/present/editor/?id="+encodeURIComponent(id)+(guest?"&guest=1":"")));
 }catch(error){console.error("Could not prepare presentation:",error);status.textContent="We couldn't open the editor. Please return to your workspace and try again.";}})();
</script></body></html>
