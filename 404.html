<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Loading page</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#20212a;font:15px system-ui,sans-serif}.card{max-width:440px;padding:32px;border:1px solid #e3e5e9;border-radius:16px;background:#fff;text-align:center}h1{font-size:34px;letter-spacing:-.05em}p{color:#737785;line-height:1.6}a{color:#008f9c;font-weight:700}</style><link rel="stylesheet" href="/assets/files/production-ui.css?v=20261124-2"><link rel="stylesheet" href="/assets/files/project-reference-ui.css?v=20261124-4">
</head><body><main class="card"><h1>Loading Project…</h1><p id="message">Opening your page.</p><p><a href="/">Return to Project</a></p></main><script>(function(){var path=location.pathname,base=path.indexOf("/project/")===0?"/project":"",route=base?path.slice(base.length):path;function render(url,adjust){fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("Page not found");return r.text()}).then(function(html){if(adjust)html=adjust(html);document.open();document.write(html);document.close()}).catch(function(){document.getElementById("message").textContent="We couldn't load this page. Return to Project and try again."});}
var guest=route.match(/^\/guest\/(canvas|ready|present|sites|forms)\/?$/);if(guest){var product=guest[1],params=new URLSearchParams(location.search);params.set("guest","1");history.replaceState(null,"",location.pathname+"?"+params.toString()+location.hash);render(base+"/"+product+"/index.html",function(html){if(html.toLowerCase().includes("<base "))return html.replace(/<base[^>]*>/i,'<base href="../">');return html.replace(/<head[^>]*>/i,'$&<base href="../">')});return;}
var profile=route.match(/^\/communities\/profiles\/([a-z0-9-]+)\/update\/?$/i);if(profile){render(base+"/communities/profiles/update/index.html");return;}
if(/^\/presentation\/?$/.test(route)){location.replace(base+"/present/"+location.search+location.hash);return;}
if(/^\/presentations\/?$/.test(route)||/^\/presentations\/new\/?$/.test(route)){location.replace(base+"/present/new/"+location.search+location.hash);return;}
var m=route.match(/^\/present\/(\d{6})(?:\/(host|audience))?\/?$/);if(m){var id=m[1],mode=m[2],target=mode==="host"?"/present/view/host/":mode==="audience"?"/present/view/audience/":"/present/editor/",p=new URLSearchParams(location.search);p.set("id",id);location.replace(base+target+"?"+p.toString());return;}
document.getElementById("message").textContent="We couldn't find that Project page.";
})();</script></body></html>
