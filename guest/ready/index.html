<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest · Project Ready</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#20212a;font:14px system-ui}.load{padding:22px;border:1px solid #e4e6eb;border-radius:14px;background:white}</style></head><body><div class="load">Opening guest Project Ready…</div><script>(async()=>{try{const base=window.APP_BASE_PATH||"",product="ready",url=base+"/"+product+"/index.html";const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error("Product could not be loaded");let html=await response.text();if(/<base\\s/i.test(html))html=html.replace(/<base\\s+href=["'][^"']*["'][^>]*>/i,'<base href="../">');else html=html.replace(/<head[^>]*>/i,'$&<base href="../">');const params=new URLSearchParams(location.search);params.set("guest","1");history.replaceState(null,"",location.pathname+"?"+params.toString()+location.hash);document.open();document.write(html);document.close()}catch(e){document.querySelector(".load").textContent="Could not open guest mode: "+e.message}})();</script></body></html>
