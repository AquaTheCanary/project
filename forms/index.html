<main class="shell"><section class="hero"><div><div class="section-kicker">COLLECT IDEAS AND ANSWERS</div><h1>Forms, made simple.</h1><p>Create a form, share a link and review responses in one place.</p></div><button id="new" class="btn-primary-large">＋ New form</button></section><div class="layout"><aside class="panel"><strong style="font-size:13px">Your forms</strong><div id="list" class="list"><p class="muted">Loading…</p></div></aside><section class="panel" id="editor"><div class="empty"><h2>Start with a new form</h2><p>Create a form to collect feedback, registrations or ideas.</p><button id="start" class="btn-primary-large">Create a form</button></div></section></div></main><footer><div class="footer-inner"><span>© 2026 Project</span><a href="https://github.com/AquaTheCanary/project" target="_blank" rel="noopener">View on GitHub</a></div></footer>
<script>
(async()=>{const $=id=>document.getElementById(id),db=firebase.firestore(),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),url=p=>window.getAppUrl?window.getAppUrl(p):p,guest=new URLSearchParams(location.search).get("guest")==="1";let user,forms=[],active;const blank=()=>({title:"Untitled form",description:"",published:false,fields:[{label:"Your name",type:"text",required:true},{label:"Email address",type:"email",required:true}]});function drawList(){const list=$("list");list.replaceChildren();if(!forms.length){list.innerHTML='<p class="muted">No forms yet.</p>';return}forms.forEach(f=>{const b=document.createElement("button");b.className=active?.id===f.id?"active":"";b.innerHTML="<strong>"+esc(f.title)+"</strong><small>"+(f.published?"Published":"Draft")+"</small>";b.onclick=()=>{active=f;draw()};list.append(b)})}function collect(){return {...active,title:$("title").value.trim()||"Untitled form",description:$("description").value,fields:[...document.querySelectorAll(".field")].map(x=>({label:x.querySelector(".label").value||"Question",type:x.querySelector("select").value,required:x.querySelector(".required").checked,...(x.querySelector(".options")?{options:x.querySelector(".options").value.split(",").map(v=>v.trim()).filter(Boolean)}:{})}))}}function draw(){const e=$("editor");e.innerHTML='<div class="top"><input id="title" value="'+esc(active.title)+'" aria-label="Form title"><div class="actions"><button id="save" class="btn-secondary-small">Save draft</button><button id="publish" class="btn-primary-large">Publish form</button><button id="community-share" class="btn-secondary-small">Share to Communities</button></div></div><textarea id="description" rows="2" placeholder="Short description" style="width:100%;margin-top:14px;padding:11px;border:1px solid var(--border-color);border-radius:9px;font:inherit;font-size:12px">'+esc(active.description||"")+'</textarea><h3 style="font-size:13px;margin:22px 0 10px">Questions</h3><div id="fields">'+active.fields.map((f,i)=>'<div class="field" data-i="'+i+'"><div class="fieldrow"><input class="label" value="'+esc(f.label)+'" placeholder="Question label"><select><option value="text" '+(f.type==="text"?"selected":"")+'>Short answer</option><option value="textarea" '+(f.type==="textarea"?"selected":"")+'>Long answer</option><option value="email" '+(f.type==="email"?"selected":"")+'>Email</option><option value="select" '+(f.type==="select"?"selected":"")+'>Dropdown</option><option value="checkbox" '+(f.type==="checkbox"?"selected":"")+'>Checkbox</option></select></div>'+(f.type==="select"?'<input class="options field-options" value="'+esc((f.options||[]).join(", "))+'" placeholder="Options separated by commas">':"")+'<div class="fieldmeta"><label><input class="required" type="checkbox" '+(f.required?"checked":"")+'> Required</label><button data-duplicate="'+i+'">Duplicate</button><button data-remove="'+i+'">Remove</button></div></div>').join("")+'</div><div class="actions" style="margin-top:12px"><button id="addtext" class="btn-secondary-small">＋ Short answer</button><button id="addlong" class="btn-secondary-small">＋ Long answer</button><button id="addselect" class="btn-secondary-small">＋ Dropdown</button></div><div id="share" class="linkrow" '+(active.published?"":"hidden")+'><input id="shareurl" readonly value="'+(active.published?esc(location.origin+url("/forms/take/"+active.id+"/")):"")+'"><button id="copy" class="btn-secondary-small">Copy link</button></div><p class="status" id="status">Changes are saved when you choose Save draft or Publish.</p><hr style="border:0;border-top:1px solid var(--border-color);margin:22px 0"><strong style="font-size:13px">Responses</strong><div id="responses" class="responses"><p class="muted">Loading responses…</p></div>';const add=t=>{active=collect();active.fields.push({label:"New question",type:t,required:false,...(t==="select"?{options:["Option 1","Option 2"]}:{})});draw()};$("addtext").onclick=()=>add("text");$("addlong").onclick=()=>add("textarea");$("addselect").onclick=()=>add("select");$("fields").onclick=x=>{const duplicate=x.target.closest("[data-duplicate]");if(duplicate){active=collect();const index=+duplicate.dataset.duplicate,copy={...active.fields[index],label:active.fields[index].label+" (copy)"};if(copy.options)copy.options=[...copy.options];active.fields.splice(index+1,0,copy);draw();return}const b=x.target.closest("[data-remove]");if(b){active=collect();active.fields.splice(+b.dataset.remove,1);draw()}};$("fields").onchange=x=>{if(x.target.tagName==="SELECT"){active=collect();const i=+x.target.closest(".field").dataset.i;active.fields[i].type=x.target.value;draw()}};$("save").onclick=()=>save(false);$("publish").onclick=()=>save(true);$("community-share").onclick=async()=>{try{if(guest)throw new Error("Sign in to share a form with Communities.");if(!active.id)throw new Error("Save this form before sharing it.");const payload=collect();const id=await projectCloud.shareCopy("forms",payload.title,payload,payload.description);$("status").textContent="Shared to Communities · public copy created.";window.location.href=url("/communities/design/?id="+encodeURIComponent(id))}catch(e){$("status").textContent=e.message||"Could not share this form."}};if($("copy"))$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("shareurl").value);$("copy").textContent="Copied"}catch(_){$("shareurl").select();document.execCommand("copy")}};loadResponses()}function allocateFormId(){return String(Math.floor(100000+Math.random()*900000))}async function save(publish){const d=collect();d.published=publish;if(guest){d.published=false;active={...active,...d};drawList();draw();$("status").textContent="Guest mode · changes are only in this session and cannot be saved or published.";return}d.updatedAt=firebase.firestore.FieldValue.serverTimestamp();$("status").textContent="Saving…";try{if(active.id){await db.collection("forms").doc(active.id).update(d)}else{const formId=await allocateFormId();await db.collection("forms").doc(formId).set({...d,ownerUid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});d.id=formId;d.ownerUid=user.uid}active={...active,...d};if(active.id&&/^\/forms\/new\/?$/.test(location.pathname))history.replaceState(null,"","/forms/"+encodeURIComponent(active.id)+"/");forms=[active,...forms.filter(f=>f.id!==active.id)];drawList();draw();$("status").textContent=publish?"Form published":"Draft saved"}catch(e){$("status").textContent="Save failed: "+e.message;console.error(e)}}async function loadResponses(){if(guest){$("responses").textContent="Guest mode · responses are not collected or stored.";return}if(!active.id){$("responses").innerHTML="<p class=muted>Save your form to start collecting responses.</p>";return}try{const snap=await db.collection("formResponses").where("formId","==",active.id).where("ownerUid","==",user.uid).get();const box=$("responses");box.replaceChildren();if(!snap.size){box.innerHTML='<p class="muted">No responses yet.</p>';return}const exportButton=document.createElement("button");exportButton.className="btn-secondary-small";exportButton.textContent="Download responses CSV";exportButton.onclick=()=>{const rows=snap.docs.map(doc=>doc.data()),keys=[...new Set(rows.flatMap(row=>Object.keys(row.answers||{})))],quote=value=>JSON.stringify(String(value??"")),csv=[keys.map(quote).join(","),...rows.map(row=>keys.map(key=>quote(row.answers?.[key])).join(","))].join(String.fromCharCode(10)),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a"),href=URL.createObjectURL(blob);a.href=href;a.download=(active.title||"form").replace(/[^a-z0-9-_]+/gi,"-")+"-responses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(href),1000)};box.append(exportButton);snap.forEach(doc=>{const d=doc.data(),r=document.createElement("div");r.className="response";r.innerHTML="<strong>Response</strong>"+Object.entries(d.answers||{}).map(([k,v])=>"<div>"+esc(k)+": "+esc(v)+"</div>").join("");box.append(r)})}catch(e){$("responses").textContent="Responses unavailable: "+e.message}}$("new").onclick=$("start").onclick=()=>{active={...blank(),id:"",ownerUid:user.uid};drawList();draw()};user=await studioAuth.currentUser();if(!user&&!guest){location.replace(url("/guest/forms/"));return}if(guest)user={uid:"guest"};$("account").textContent=guest?"Guest mode":user.email||"Workspace";const snap=guest?null:await db.collection("forms").where("ownerUid","==",user.uid).get();forms=snap?snap.docs.map(d=>({...d.data(),id:d.id})):[];drawList();const params=new URLSearchParams(location.search),requested=params.get("id");if(requested){active=forms.find(x=>x.id===requested);if(!active)throw new Error("That form was not found in your workspace.");draw();if(params.get("view")==="results")setTimeout(()=>document.getElementById("responses")?.scrollIntoView({behavior:"smooth",block:"start"}),100)}else if(params.get("create")==="1"){active={...blank(),id:"",ownerUid:user.uid};drawList();draw()}else if(forms.length){active=forms[0];draw()}else if(guest){active={...blank(),id:"",ownerUid:user.uid};drawList();draw()}})().catch(e=>{console.error(e);document.getElementById("list").textContent="Could not load Forms: "+e.message});
