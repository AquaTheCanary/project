<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel | Project</title><link rel="icon" href="../assets/images/project-mark.svg"><link rel="stylesheet" href="../assets/files/style.css"><script src="../assets/files/router.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="../assets/files/auth-config.js?v=20261122-admin"></script><script src="../assets/files/auth-guard.js?v=20261121-2"></script><link rel="stylesheet" href="../assets/files/design-system.css?v=firework-inspired-1"><style>
body.page-body{background:#f6f7fb;color:#242638}.admin-shell{width:min(1050px,calc(100% - 32px));margin:0 auto;padding:42px 0 80px}.admin-head{margin-bottom:26px}.admin-head h1{font-size:clamp(32px,5vw,46px);letter-spacing:-1.7px}.admin-card{background:#fff;border:1px solid #e6e8ef;border-radius:15px;padding:24px;margin:16px 0;box-shadow:0 8px 25px #25263b08}.admin-card h2{font-size:18px;margin-bottom:6px}.admin-card p{font-size:12px;color:#737b8c;line-height:1.7}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.admin-field{display:grid;gap:6px;margin:14px 0}.admin-field label{font-size:11px;font-weight:750;color:#555d6e}.admin-field input,.admin-field textarea,.admin-field select{width:100%;padding:11px 12px;border:1px solid #dfe3ea;border-radius:9px;background:#fff;color:#252638;font:inherit;font-size:13px}.admin-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}.admin-list{display:grid;gap:10px;margin-top:17px}.admin-item{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px;border:1px solid #e9ebf1;border-radius:10px}.admin-item strong{display:block;font-size:13px}.admin-item small{color:#7a8291;font-size:11px}.admin-item button{border:1px solid #e4e6ed;border-radius:8px;background:#fff;padding:8px 10px;font-size:11px}.admin-status{font-size:12px;color:#687181;min-height:18px}.admin-status.error{color:#bd3848}.admin-status.success{color:#19835d}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-card{padding:17px}}
</style><link rel="stylesheet" href="/assets/files/studio-polish.css?v=20261124-4">
<link rel="stylesheet" href="/assets/files/production-ui.css?v=20261124-1">
</head><body class="page-body"><header class="home-nav"><div class="nav-brand"><a data-route="/dashboard/"><img src="../assets/images/project-logo.svg" class="brand-logo" alt="Project"></a><span class="brand-name">Admin panel</span></div><nav class="nav-links"><a data-route="/dashboard/">Workspace</a><a data-route="/settings/">Settings</a></nav></header><main class="admin-shell"><div class="admin-head"><div class="section-kicker">PROJECT ADMINISTRATION</div><h1>Announcements</h1><p>Manage the scrolling announcement bar shown at the top of the workspace.</p></div><section class="admin-card"><h2>Bar properties</h2><p>These settings apply to the whole announcement ticker.</p><div class="admin-grid"><div class="admin-field"><label for="ticker-label">Bar label</label><input id="ticker-label" maxlength="24" value="What's new"></div><div class="admin-field"><label for="ticker-speed">Scroll duration (seconds)</label><input id="ticker-speed" type="number" min="12" max="90" value="32"></div></div></section><section class="admin-card"><h2 id="editor-title">Create announcement</h2><div class="admin-grid"><div class="admin-field"><label for="notice-title">Title</label><input id="notice-title" maxlength="60" placeholder="New feature"></div><div class="admin-field"><label for="notice-link-label">Link label (optional)</label><input id="notice-link-label" maxlength="24" placeholder="Learn more"></div></div><div class="admin-field"><label for="notice-message">Message</label><textarea id="notice-message" rows="2" maxlength="180" placeholder="Tell people what's new…"></textarea></div><div class="admin-grid"><div class="admin-field"><label for="notice-url">Link URL (optional)</label><input id="notice-url" type="url" maxlength="500" placeholder="https://example.com"></div><div class="admin-field"><label for="notice-priority">Priority (higher appears first)</label><input id="notice-priority" type="number" min="0" max="100" value="0"></div></div><div class="admin-grid"><div class="admin-field"><label for="notice-start">Start showing (optional)</label><input id="notice-start" type="datetime-local"></div><div class="admin-field"><label for="notice-end">Stop showing (optional)</label><input id="notice-end" type="datetime-local"></div></div><div class="admin-grid"><div class="admin-field"><label><input id="notice-enabled" type="checkbox" checked> Enabled</label></div><div class="admin-field"><label><input id="notice-dismissible" type="checkbox" checked> Allow visitors to dismiss</label></div></div><div class="admin-actions"><button class="btn primary" id="save-notice">Save announcement</button><button class="btn" id="cancel-edit" type="button" hidden>Cancel edit</button><span class="admin-status" id="admin-status" aria-live="polite"></span></div></section><section class="admin-card"><h2>Current announcements</h2><div id="announcement-list" class="admin-list"><p>Loading…</p></div><div class="admin-actions"><button class="btn primary" id="save-bar">Save bar properties</button><span class="admin-status" id="bar-status" aria-live="polite"></span></div></section></main><script>
(async()=>{const $=id=>document.getElementById(id),db=firebase.firestore(),ref=db.collection("siteConfig").doc("announcements");let items=[],editing=null;
const status=(id,msg,type)=>{$(id).textContent=msg;$(id).className="admin-status"+(type?" "+type:"")};
function reset(){editing=null;["notice-title","notice-link-label","notice-message","notice-url","notice-start","notice-end"].forEach(id=>$(id).value="");$("notice-priority").value="0";$("notice-enabled").checked=true;$("notice-dismissible").checked=true;$("editor-title").textContent="Create announcement";$("save-notice").textContent="Save announcement";$("cancel-edit").hidden=true}
function render(){const root=$("announcement-list");root.replaceChildren();if(!items.length){const p=document.createElement("p");p.textContent="No announcements yet.";root.append(p);return}items.forEach(item=>{const row=document.createElement("div");row.className="admin-item";const info=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("small");title.textContent=item.title||"Announcement";meta.textContent=(item.enabled===false?"Disabled":"Enabled")+" · priority "+(item.priority||0);info.append(title,meta);const actions=document.createElement("div"),edit=document.createElement("button"),del=document.createElement("button");edit.textContent="Edit";del.textContent="Delete";edit.onclick=()=>{editing=item.id;$("notice-title").value=item.title||"";$("notice-link-label").value=item.linkLabel||"";$("notice-message").value=item.message||"";$("notice-url").value=item.url||"";$("notice-priority").value=item.priority||0;$("notice-start").value=item.startsAt||"";$("notice-end").value=item.endsAt||"";$("notice-enabled").checked=item.enabled!==false;$("notice-dismissible").checked=item.dismissible!==false;$("editor-title").textContent="Edit announcement";$("save-notice").textContent="Update announcement";$("cancel-edit").hidden=false;window.scrollTo({top:0,behavior:"smooth"})};del.onclick=()=>{if(!confirm("Delete this announcement?"))return;items=items.filter(x=>x.id!==item.id);render();saveAll("admin-status","Announcement deleted.","success")};actions.append(edit,del);row.append(info,actions);root.append(row)})}
async function saveAll(id,msg,type){try{await ref.set({label:$("ticker-label").value.trim()||"What's new",speed:Math.max(12,Math.min(90,Number($("ticker-speed").value)||32)),items,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});status(id,msg,type)}catch(e){status(id,e.message||"Could not save announcements.","error")}}
try{const user=await studioAuth.currentUser();if(!user){location.replace(window.getAppUrl("/login/"));return}const admin=await db.collection("admins").doc(user.uid).get();if(!admin.exists){document.querySelector(".admin-shell").innerHTML="<section class='admin-card'><h1>Admin access required</h1><p>This account is not registered as a Project administrator. Ask the project owner to provision your account in Firebase.</p><a href='/dashboard/'>Return to workspace</a></section>";return}const snap=await ref.get();if(snap.exists){const data=snap.data();$("ticker-label").value=data.label||"What's new";$("ticker-speed").value=data.speed||32;items=Array.isArray(data.items)?data.items:[]}render();
$("save-notice").onclick=async()=>{const title=$("notice-title").value.trim(),message=$("notice-message").value.trim(),url=$("notice-url").value.trim();if(!title||!message){status("admin-status","Add both a title and a message.","error");return}if(url&&!/^https:\/\//i.test(url)){status("admin-status","Links must start with https://.","error");return}const item={id:editing||("notice-"+Date.now()),title,message,url,linkLabel:$("notice-link-label").value.trim(),priority:Number($("notice-priority").value)||0,startsAt:$("notice-start").value,endsAt:$("notice-end").value,enabled:$("notice-enabled").checked,dismissible:$("notice-dismissible").checked};if(editing)items=items.map(x=>x.id===editing?item:x);else items.push(item);await saveAll("admin-status","Announcement saved.","success");render();reset()};
$("cancel-edit").onclick=reset;$("save-bar").onclick=()=>saveAll("bar-status","Bar properties saved.","success");
}catch(e){status("admin-status",e.message||"Admin panel could not be loaded.","error")}
})();
</script></body></html>
