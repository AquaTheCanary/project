</head><body><header class="nav"><a class="brand" href="/communities/" data-route="/communities/"><img src="../../../assets/images/newp-nobg.png" alt=""><span>Community profile</span></a><nav class="navlinks"><a href="/settings/" data-route="/settings/">Settings</a><a href="/dashboard/" data-route="/dashboard/">Dashboard</a></nav></header><main class="shell"><a class="back" href="/settings/" data-route="/settings/">← Back to settings</a><div class="head"><div class="eyebrow" style="font-size:10px;font-weight:800;letter-spacing:.14em;color:#6257d9">YOUR COMMUNITY IDENTITY</div><h1>Update your profile.</h1><p>This is the profile people see when you choose to make it public. Your account email and private details are never displayed here.</p></div><section class="card"><div id="loading" class="status">Checking account and profile…</div><form id="profile-form" hidden><label class="field"><span>Display name</span><input id="name" maxlength="80" required></label><label class="field"><span>About you</span><textarea id="bio" maxlength="240" placeholder="A short introduction"></textarea></label><label class="field"><span>Website</span><input id="website" type="url" maxlength="200" placeholder="https://example.com"></label><label class="field"><span>Profile visibility</span><select id="visibility"><option value="private">Private — only you can view it</option><option value="public">Public — anyone with your profile link</option></select></label><div class="checks"><label><input type="checkbox" id="show-name" checked> Show display name</label><label><input type="checkbox" id="show-avatar" checked> Show profile photo</label></div><div class="actions"><button class="btn primary" id="save" type="submit">Save profile</button><a class="btn" href="/settings/" data-route="/settings/">Cancel</a><span class="status" id="message" aria-live="polite"></span></div></form></section></main><script>
(async()=>{const $=id=>document.getElementById(id),db=firebase.firestore();let user=null,handle="",profile={},publicProfile={};const msg=(t,kind="")=>{$("message").textContent=t;$("message").className="status "+kind};try{const path=location.pathname.replace(window.APP_BASE_PATH||"",""),m=path.match(/\/communities\/profiles\/([a-z0-9-]+)\/update\/?$/i);handle=new URLSearchParams(location.search).get("handle")||(m&&m[1])||"";if(!handle)throw new Error("This profile update link is missing its username.");user=await studioAuth.currentUser();if(!user){try{sessionStorage.setItem("studio_return_to",location.pathname+location.search)}catch(_){}location.replace(window.getAppUrl("/login/"));return}const handleDoc=await db.collection("handles").doc(handle).get();if(!handleDoc.exists||handleDoc.data().uid!==user.uid){location.replace(window.getAppUrl("/settings/"));return}const [profileSnap,publicSnap]=await Promise.all([db.collection("userProfiles").doc(user.uid).get(),db.collection("publicProfiles").doc(user.uid).get()]);profile=profileSnap.exists?profileSnap.data():{};publicProfile=publicSnap.exists?publicSnap.data():{};$("name").value=publicProfile.displayName||profile.displayName||user.displayName||"";$("bio").value=publicProfile.bio||"";$("website").value=publicProfile.website||"";$("visibility").value=publicProfile.visibility||"private";$("show-name").checked=publicProfile.showName!==false;$("show-avatar").checked=publicProfile.showAvatar!==false;$("loading").hidden=true;$("profile-form").hidden=false;document.title="Update @"+handle+" | Project";$("profile-form").onsubmit=async e=>{e.preventDefault();const b=$("save");b.disabled=true;b.textContent="Saving…";try{const displayName=$("name").value.trim(),website=$("website").value.trim();if(!displayName)throw Error("Add a display name.");if(website&&!/^https:\/\//i.test(website))throw Error("Use a website URL beginning with https://.");await user.updateProfile({displayName});const data={uid:user.uid,handle,displayName,photoURL:profile.photoURL||user.photoURL||"",bio:$("bio").value.trim(),website,visibility:$("visibility").value,showName:$("show-name").checked,showAvatar:$("show-avatar").checked,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection("userProfiles").doc(user.uid).set({uid:user.uid,displayName,handle,photoURL:data.photoURL,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await db.collection("publicProfiles").doc(user.uid).set(data,{merge:true});msg("Profile updated and saved to your account.","success")}catch(error){msg(error.message||"Could not save profile.","error")}finally{b.disabled=false;b.textContent="Save profile"}}}catch(error){$("loading").textContent=error.message||"Could not load your profile.";msg(error.message||"Could not load profile.","error")}})();
</script></body></html>
