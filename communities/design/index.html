(async()=>{const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),shareId=params.get("id"),db=firebase.firestore();let design=null;const say=t=>$("copy-message").textContent=t;function show(){const p=design.product;$("product-tag").textContent=p==="canvas"?"PRODUCT CANVAS":p==="ready"?"PROJECT READY":p==="forms"?"PROJECT FORMS":p==="sites"?"PROJECT SITES":"PROJECT PRESENT";$("design-title").textContent=design.title||"Untitled design";$("design-description").textContent=design.description||"A public copy shared with the Project community.";$("design-owner").textContent="Shared by "+(design.ownerName||"Project creator");const box=$("preview");box.replaceChildren();if(p==="canvas"){const data=design.content||{},svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 1200 800");const bg=document.createElementNS(svg.namespaceURI,"rect");bg.setAttribute("width","1200");bg.setAttribute("height","800");bg.setAttribute("fill","#fff");svg.append(bg);(data.items||[]).forEach(o=>{let el;if(o.type==="rect"){el=document.createElementNS(svg.namespaceURI,"rect");el.setAttribute("x",o.x);el.setAttribute("y",o.y);el.setAttribute("width",o.w);el.setAttribute("height",o.h);el.setAttribute("rx",o.rx||0)}else if(o.type==="ellipse"){el=document.createElementNS(svg.namespaceURI,"ellipse");el.setAttribute("cx",o.x+o.w/2);el.setAttribute("cy",o.y+o.h/2);el.setAttribute("rx",o.w/2);el.setAttribute("ry",o.h/2)}else{el=document.createElementNS(svg.namespaceURI,"text");el.setAttribute("x",o.x);el.setAttribute("y",o.y+Math.max(24,o.h*.75));el.setAttribute("font-size",o.fontSize||48);el.setAttribute("font-family","Arial,sans-serif");el.setAttribute("font-weight","600");el.textContent=o.text||"Text"}if(o.type!=="text")el.setAttribute("fill",o.fill||"#e7ff6e");else el.setAttribute("fill",o.fill||"#20212a");svg.append(el)});const wrap=document.createElement("div");wrap.className="preview-canvas";wrap.append(svg);box.append(wrap)}else if(p==="ready"){const files=(design.content||{}).files||{},html=String(files.html||"<!doctype html><h1>Shared app</h1>"),src=html.replace(/<\/head>/i,"<style>"+String(files.css||"")+"</style></head>").replace(/<\/body>/i,"<script>"+String(files.js||"")+"<"+"/script></body>");const frame=document.createElement("iframe");frame.className="preview-ready";frame.setAttribute("sandbox","allow-scripts");frame.title="Public app preview";frame.srcdoc=src;box.append(frame)}else if(p==="forms"||p==="sites"){const d=design.content||{},wrap=document.createElement("div");wrap.className="preview-present";wrap.style.background=p==="sites"?(d.background||"#f7f8fc"):"#fff";const kicker=document.createElement("span");kicker.className="tag";kicker.textContent=p==="forms"?"FORM TEMPLATE":"WEBSITE PREVIEW";const h=document.createElement("h2");h.textContent=p==="sites"?(d.headline||d.siteName||design.title):(d.title||design.title);const para=document.createElement("p");para.textContent=p==="sites"?(d.subheadline||d.description||"A website shared with the Project community."):(d.description||"A form template shared with the Project community.");wrap.append(kicker,h,para);if(p==="forms"){const count=document.createElement("p");count.textContent=(d.fields||[]).length+" questions";wrap.append(count)}else{(d.sections||[]).slice(0,4).forEach(section=>{const item=document.createElement("p");item.textContent=[section.title,section.text].filter(Boolean).join(" — ");wrap.append(item)})}box.append(wrap)}else{const deck=design.content||{},slide=(deck.slides||[])[0]||{},wrap=document.createElement("div");wrap.className="preview-present";wrap.style.background=slide.bg||"#fff";const kicker=document.createElement("span");kicker.className="tag";kicker.textContent=slide.kicker||"PROJECT PRESENT";const h=document.createElement("h2");h.textContent=slide.heading||"Shared presentation";h.style.color=slide.ink||"#202431";const ptag=document.createElement("p");ptag.textContent=slide.copy||"Explore this interactive presentation by making your own copy.";wrap.append(kicker,h,ptag);box.append(wrap)}}try{if(!shareId)throw Error("This share link is missing its design ID.");design=await window.projectCloud.publicCopy(shareId);if(!design)throw Error("This public design is unavailable or has been removed.");show()}catch(e){$("design-title").textContent="Design unavailable";$("design-description").textContent=e.message; $("make-copy").disabled=true} $("make-copy").onclick=async()=>{const b=$("make-copy");b.disabled=true;b.textContent="Copying…";try{const user=await studioAuth.currentUser();if(!user){try{sessionStorage.setItem("studio_return_to",location.pathname+location.search)}catch(_){}location.replace(window.getAppUrl("/login/"));return}const type=design.product,content=JSON.parse(JSON.stringify(design.content||{}));if(type==="forms"){const ref=await db.collection("forms").add({...content,title:design.title||content.title||"Untitled form",ownerUid:user.uid,published:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});say("A private draft copy has been added to your Forms workspace.");location.href=window.getAppUrl("/forms/?id="+encodeURIComponent(ref.id));return}if(type==="sites"){const slug=String(Math.floor(100000+Math.random()*900000));await db.collection("websites").doc(slug).set({...content,slug,ownerUid:user.uid,username:"",siteName:design.title||content.siteName||"Untitled website",title:design.title||content.title||"Untitled website",status:"draft",createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});say("A private draft copy has been added to your Sites workspace.");location.href=window.getAppUrl("/websites/?id="+encodeURIComponent(slug));return}const id=type==="present"?String(Math.floor(100000+Math.random()*900000)):type+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6);if(type==="present")content.id=id;await p
