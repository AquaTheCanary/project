name: Deploy Project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          # index.html at the repository root is the real Project homepage.
          # Keep it intact: it contains the complete page markup and layout.
          test -s _site/index.html
          grep -q 'class="page-body marketing"' _site/index.html

          # Confirm that the stylesheets referenced by the homepage are included.
          test -s _site/assets/files/style.css
          test -s _site/assets/files/design-system.css
          grep -q '/assets/files/style.css' _site/index.html
          grep -q '/assets/files/design-system.css' _site/index.html

          # The canonical product URLs are /presenter/ and /websites/.
          # Do not create obsolete /present/ or /sites/ aliases.
          test -s _site/presenter/index.html
          test -s _site/websites/index.html
          test -s _site/websites/editor/index.html
          test -s _site/websites/publish/index.html

          # Catch dynamic product URLs and route them to the canonical app
          # entry point while preserving the requested ID as a query parameter.
          cat > _site/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <title>Page not found | Project</title>
          </head>
          <body>
            <script>
            (function(){
              var path=decodeURIComponent(location.pathname);
              var match, target=null;
              if((match=path.match(/^\\/presenter\\/(\\d{6})\\/?$/i))) target="/presenter/?id="+encodeURIComponent(match[1]);
              else if((match=path.match(/^\\/presenter\\/(\\d{6})\\/(audience|presenter)\\/?$/i))) target="/presenter/?id="+encodeURIComponent(match[1])+"&mode="+encodeURIComponent(match[2].toLowerCase());
              else if((match=path.match(/^\\/view\\/(\\d{6})\\/?$/i))) target="/presenter/?id="+encodeURIComponent(match[1]);
              else if((match=path.match(/^\\/presentations\\/view\\/([a-z0-9_-]+)\\/(audience|presenter)\\/?$/i))) target="/presenter/?id="+encodeURIComponent(match[1])+"&mode="+encodeURIComponent(match[2].toLowerCase());
              else if((match=path.match(/^\\/websites\\/([a-z0-9-]+)\\/(editor|publish)\\/?$/i))) target="/websites/"+match[2].toLowerCase()+"/?id="+encodeURIComponent(match[1]);
              if(target){location.replace(target+location.hash);return;}
              document.body.innerHTML='<main style="font:16px system-ui;text-align:center;padding:12vh 20px"><h1>Page not found</h1><p>That Project page may have moved, or the address may be incorrect.</p><a href="/">Back to Project</a></main>';
            })();
            </script>
          </body>
          </html>
          EOF

          # /home remains a compatibility URL and redirects to the root homepage.
          mkdir -p _site/home
          cat > _site/home/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=../">
            <link rel="canonical" href="../">
            <title>Redirecting to Project</title>
            <script>window.location.replace("../" + location.search + location.hash);</script>
          </head>
          <body><p>Redirecting to <a href="../">Project</a>…</p></body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
