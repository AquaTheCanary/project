name: Deploy Project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='presentations' ./ _site/

          # The homepage source lives in /home in the repository, but is published at /.
          test -s home/index.html
          cp home/index.html _site/index.html
          grep -q 'class="page-body marketing"' _site/index.html

          # Confirm that the stylesheets referenced by the homepage are included.
          test -s _site/assets/files/style.css
          test -s _site/assets/files/design-system.css
          grep -q '/assets/files/style.css' _site/index.html
          grep -q '/assets/files/design-system.css' _site/index.html

          # Canonical public route structure. App implementations remain in their
          # existing source folders; these checks ensure their entry points ship.
          test -s _site/dashboard/index.html
          test -s _site/settings/index.html
          test -s _site/status/index.html
          test -s _site/help/index.html
          test -s _site/products/index.html
          test -s _site/solutions/index.html
          test -s _site/resources/index.html
          test -s _site/forms/index.html
          test -s _site/websites/index.html
          test -s presentations/new/index.html
          test -s presentations/editor/index.html
          test -s presentations/view/presenter/index.html
          test -s presentations/view/audience/index.html
          test -s _site/forms/respond/index.html
          test -s _site/forms/submitted/index.html

          # Build clean public entry points and legacy policy redirects.
          mkdir -p _site/login/personal _site/login/organisation
          cat > _site/login/personal/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace("/auth/personal/login/"+location.search+location.hash)</script><a href="/auth/personal/login/">Continue</a>
          EOF
          cat > _site/login/organisation/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace("/auth/organisation/login/"+location.search+location.hash)</script><a href="/auth/organisation/login/">Continue</a>
          EOF
          mkdir -p _site/register/personal _site/register/organisation
          cat > _site/register/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | Project</title><link rel="stylesheet" href="/assets/files/design-system.css"><main style="max-width:720px;margin:12vh auto;padding:24px;font:16px system-ui"><h1>Create your Project account</h1><p>Choose the type of account you want to create.</p><p><a href="/register/personal/">Personal account →</a></p><p><a href="/register/organisation/">Organisation account →</a></p></main>
          EOF
          cat > _site/register/personal/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/auth/personal/register/"+location.search+location.hash)</script><a href="/auth/personal/register/">Continue</a>
          EOF
          cat > _site/register/organisation/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/auth/organisation/register/"+location.search+location.hash)</script><a href="/auth/organisation/register/">Continue</a>
          EOF
          mkdir -p _site/sites/new _site/presentation/new _site/forms/new _site/forms/submitted _site/legal/policies/terms-of-service _site/legal/policies/privacy
          cat > _site/sites/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/sites/new/"+location.search+location.hash)</script><a href="/sites/new/">Create a site</a>
          EOF
          cat > _site/sites/new/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/websites/?create=1"+location.hash)</script><a href="/websites/?create=1">Create a site</a>
          EOF
          cat > _site/presentation/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace("/presentation/new/"+location.search+location.hash)</script><a href="/presentation/new/">Create a presentation</a>
          EOF
          cp presentations/new/index.html _site/presentation/new/index.html
          test -s _site/presentation/index.html
          test -s _site/presentation/new/index.html
          mkdir -p _site/legal/policies
          cp _site/legal/terms-of-service/index.html _site/legal/policies/terms-of-service/index.html
          cp _site/legal/privacy-policy/index.html _site/legal/policies/privacy/index.html
          for alias in privacy privacy-policy; do mkdir -p "_site/$alias"; cat > "_site/$alias/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/legal/policies/privacy/"+location.search+location.hash)</script><a href="/legal/policies/privacy/">Privacy</a>
          EOF
          done
          for alias in tos terms-of-service tos-policy terms-of-service-policy; do mkdir -p "_site/$alias"; cat > "_site/$alias/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/legal/policies/terms-of-service/"+location.search+location.hash)</script><a href="/legal/policies/terms-of-service/">Terms of service</a>
          EOF
          done

          # Serve the existing Forms builder at /forms/new; /forms itself redirects there.
          cp _site/forms/index.html _site/forms/new/index.html
          sed -i 's#../assets/#/assets/#g' _site/forms/new/index.html
          cat > _site/forms/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/forms/new/"+location.search+location.hash)</script><a href="/forms/new/">Open Forms</a>
          EOF
          cat > _site/forms/submitted/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Response submitted | Project Forms</title><link rel="stylesheet" href="/assets/files/design-system.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fc;color:#252638;font:16px system-ui}.card{width:min(560px,calc(100% - 40px));padding:38px;background:white;border:1px solid #e7e8f0;border-radius:18px;text-align:center}h1{letter-spacing:-.05em}p{color:#6b7080;line-height:1.7}a{color:#635bff;font-weight:700}</style></head><body><main class="card"><p>PROJECT FORMS</p><h1>Thank you.</h1><p>Your response has been submitted successfully.</p><a href="/">Back to Project</a></main></body></html>
          EOF
          # Dynamic app routes are resolved here so GitHub Pages can serve clean URLs.
          cat > _site/404.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Project</title></head>
          <body><script>
          (function(){
            var p=decodeURIComponent(location.pathname),m,t=null,q=location.search,h=location.hash;
            if((m=p.match(/^\/sites\/view\/([0-9]{6})\/?$/))) t="/published-sites-static/?preview="+encodeURIComponent(m[1]);
            else if((m=p.match(/^\/sites\/([0-9]{6})\/?$/))) t="/websites/?id="+encodeURIComponent(m[1]);
            else if(p==="/presentation/new/" || p==="/presentation/new") t="/presentation/new/";
            else if(p==="/present" || p==="/present/") t="/presentation/";
            else if(p==="/present/new/" || p==="/present/new") t="/presentation/new/";
            else if((m=p.match(/^\/present\/(\d{6})\/host\/?$/))) t="/presentation/"+encodeURIComponent(m[1])+"/present/host/";
            else if((m=p.match(/^\/present\/(\d{6})\/audience\/?$/))) t="/presentation/"+encodeURIComponent(m[1])+"/present/audience/";
            else if((m=p.match(/^\/present\/(\d{6})\/?$/))) t="/presentation/"+encodeURIComponent(m[1])+"/";
            else if((m=p.match(/^\/presentation\/(\d{6})\/present\/(host|audience)\/?$/))){
              var id=encodeURIComponent(m[1]),kind=m[2],src=kind==="host"?"presenter":"audience";
              history.replaceState(null,"",p+"?id="+id+q+h);
              fetch("https://raw.githubusercontent.com/AquaTheCanary/project/main/presentations/view/"+src+"/index.html").then(r=>{if(!r.ok)throw Error("not found");return r.text()}).then(html=>{if(!/<base\b/i.test(html))html=html.replace("<head>","<head><base href=\"/\">");document.open();document.write(html);document.close()}).catch(()=>{document.body.textContent="This presentation view could not be loaded."});
              return;
            } else if((m=p.match(/^\/presentation\/(\d{6})\/?$/))){
              var id=encodeURIComponent(m[1]);
              history.replaceState(null,"",p+"?id="+id+q+h);
              fetch("https://raw.githubusercontent.com/AquaTheCanary/project/main/presentations/editor/index.html").then(r=>{if(!r.ok)throw Error("not found");return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(()=>{document.body.textContent="This presentation could not be loaded."});
              return;
            } else if(p==="/presentations/new/" || p==="/presentations/new" || p==="/presentations/editor/" || p==="/presentations/editor") t="/presentation/new/";
            else if((m=p.match(/^\/forms\/take\/([^/]+)\/?$/))) t="/forms/respond/?id="+encodeURIComponent(m[1]);
            else if((m=p.match(/^\/forms\/([^/]+)\/submitted\/?$/))) t="/forms/submitted/?id="+encodeURIComponent(m[1]);
            else if((m=p.match(/^\/forms\/([^/]+)\/results\/?$/))) t="/forms/new/?id="+encodeURIComponent(m[1])+"&view=results";
            if(t){location.replace(t+(t.indexOf("?")>=0?(q?"&"+q.slice(1):""):"")+h);return;}
            document.body.innerHTML='<main style="font:16px system-ui;text-align:center;padding:12vh 20px"><h1>Page not found</h1><p>That Project page could not be found.</p><a href="/">Back to Project</a></main>';
          })();
          </script></body></html>
          EOF

          # /home redirects to the homepage published at /.
          mkdir -p _site/home
          cat > _site/home/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="canonical" href="/"><script>location.replace("/"+location.search+location.hash)</script><a href="/">Continue to Project</a>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
