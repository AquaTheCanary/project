name: Deploy Project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node for smoke checks
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check page scripts and release-critical invariants
        run: node .github/scripts/smoke-test.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='presentations' --exclude='auth' --exclude='websites' --exclude='published-sites' --exclude='assets/files/render-proxy' --exclude='functions' --exclude='backend' --exclude='forms/respond' --exclude='forms/submitted' --exclude='home' --exclude='legal/privacy-policy' --exclude='legal/terms-of-service' ./ _site/

          # The homepage source lives in /home in the repository, but is published at /.
          test -s home/index.html
          cp home/index.html _site/index.html
          # /home is an alias only; the homepage itself is served from /.
          mkdir -p _site/home
          cat > _site/home/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url=/"><link rel="canonical" href="/"><title>Redirecting to Project</title><script>location.replace("/"+location.search+location.hash)</script></head><body><a href="/">Continue to Project</a></body></html>
          EOF
          grep -q 'class="page-body marketing"' _site/index.html
          test -s _site/home/index.html

          # Confirm that the stylesheets referenced by the homepage are included.
          test -s _site/assets/files/style.css
          test -s _site/assets/files/project-reference-ui.css
          grep -q '/assets/files/style.css' _site/index.html
          grep -q '/assets/files/project-reference-ui.css' _site/index.html

          # Canonical public route structure. App implementations remain in their
          # existing source folders; these checks ensure their entry points ship.
          test -s _site/dashboard/index.html
          test -s _site/settings/index.html
          test -s _site/status/index.html
          test -s _site/help/index.html
          test -s _site/products/index.html
          test -s _site/solutions/index.html
          test -s _site/resources/index.html
          test -s forms/index.html
          test -s websites/index.html
          test -s auth/personal/login/index.html
          test -s auth/organisation/login/index.html
          test -s auth/personal/register/index.html
          test -s auth/organisation/register/index.html
          test -s present/new/index.html
          test -s present/editor/index.html
          test -s present/view/host/index.html
          test -s present/view/audience/index.html

          # Build clean public entry points and legacy policy redirects.
          mkdir -p _site/login/personal _site/login/organisation
          cp auth/personal/login/index.html _site/login/personal/index.html
          cp auth/organisation/login/index.html _site/login/organisation/index.html
          mkdir -p _site/register/personal _site/register/organisation
          cp register/index.html _site/register/index.html
          cp auth/personal/register/index.html _site/register/personal/index.html
          cp auth/organisation/register/index.html _site/register/organisation/index.html
          mkdir -p _site/sites/new _site/forms/new _site/legal/policies/terms-of-service _site/legal/policies/privacy
          cat > _site/sites/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/sites/new/"+location.search+location.hash)</script><a href="/sites/new/">Create a site</a>
          EOF
          cp websites/index.html _site/sites/new/index.html
          sed -i 's#</body>#<script>if(!new URLSearchParams(location.search).has("id")&&!new URLSearchParams(location.search).has("create"))location.replace("/sites/new/?create=1"+location.hash)</script></body>#' _site/sites/new/index.html
          mkdir -p _site/legal/policies
          cp legal/terms-of-service/index.html _site/legal/policies/terms-of-service/index.html
          cp legal/privacy-policy/index.html _site/legal/policies/privacy/index.html
          for alias in privacy privacy-policy; do mkdir -p "_site/$alias"; cat > "_site/$alias/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/legal/policies/privacy/"+location.search+location.hash)</script><a href="/legal/policies/privacy/">Privacy</a>
          EOF
          done
          for alias in tos terms-of-service tos-policy terms-of-service-policy; do mkdir -p "_site/$alias"; cat > "_site/$alias/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/legal/policies/terms-of-service/"+location.search+location.hash)</script><a href="/legal/policies/terms-of-service/">Terms of service</a>
          EOF
          done

          # Serve the existing Forms builder at /forms/new; /forms itself redirects there.
          cp _site/forms/index.html _site/forms/new/index.html
          sed -i 's#</body>#<script>if(!new URLSearchParams(location.search).has("id")&&!new URLSearchParams(location.search).has("create"))location.replace("/forms/new/?create=1"+location.hash)</script></body>#' _site/forms/new/index.html
          sed -i 's#../assets/#/assets/#g' _site/forms/new/index.html
          cat > _site/forms/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace("/forms/new/"+location.search+location.hash)</script><a href="/forms/new/">Open Forms</a>
          EOF
          # Dynamic app routes are resolved here so GitHub Pages can serve clean URLs.
          cat > _site/404.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><title>Project — Page not found</title><link rel="stylesheet" href="/assets/files/project-reference-ui.css?v=20261124-6"></head>
          <body><script>
          (function(){
            var p=decodeURIComponent(location.pathname),m,t=null,q=location.search,h=location.hash;
            function serve(source,values){
              var params=new URLSearchParams(q);
              Object.keys(values||{}).forEach(k=>params.set(k,values[k]));
              history.replaceState(null,"",p+(params.toString()?"?"+params.toString():"")+h);
              fetch("https://raw.githubusercontent.com/AquaTheCanary/project/main/"+source).then(r=>{if(!r.ok)throw Error("not found");return r.text()}).then(html=>{if(!/<base\b/i.test(html))html=html.replace("<head>","<head><base href='/'>");document.open();document.write(html);document.close()}).catch(()=>{document.body.innerHTML="<main><h1>Page could not be loaded</h1><a href='/'>Back to Project</a></main>";});
            }
            if((m=p.match(/^\/sites\/view\/([0-9]{6})\/?$/))) { serve("assets/files/published-sites-static/index.html",{preview:m[1]}); return; }
            else if((m=p.match(/^\/sites\/([0-9]{6})\/?$/))) { serve("websites/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/forms\/take\/([^/]+)\/?$/))) { serve("forms/respond/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/forms\/([^/]+)\/?$/))) { serve("forms/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/forms\/([^/]+)\/submitted\/?$/))) { serve("forms/submitted/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/forms\/([^/]+)\/results\/?$/))) { serve("forms/index.html",{id:m[1],view:"results"}); return; }
            else if((m=p.match(/^\/presentation\/([0-9]{6})\/present\/(host|audience)\/?$/))){ serve("present/view/"+(m[2]==="host"?"host":"audience")+"/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/presentation\/([0-9]{6})\/?$/))) { serve("present/editor/index.html",{id:m[1]}); return; }
            else if((m=p.match(/^\/present\/([0-9]{6})\/host\/?$/))) t="/present/"+encodeURIComponent(m[1])+"/host/";
            else if((m=p.match(/^\/present\/([0-9]{6})\/audience\/?$/))) t="/present/"+encodeURIComponent(m[1])+"/audience/";
            else if((m=p.match(/^\/present\/([0-9]{6})\/?$/))) t="/present/"+encodeURIComponent(m[1])+"/";
            else if(p==="/websites" || p==="/websites/") t="/sites/";
            else if(p==="/auth/personal/login/" || p==="/auth/personal/login") t="/login/personal/";
            else if(p==="/auth/organisation/login/" || p==="/auth/organisation/login") t="/login/organisation/";
            else if(p==="/auth/personal/register/" || p==="/auth/personal/register") t="/register/personal/";
            else if(p==="/auth/organisation/register/" || p==="/auth/organisation/register") t="/register/organisation/";
            if(t){location.replace(t+(t.indexOf("?")>=0?(q?"&"+q.slice(1):""):"")+h);return;}
            document.body.innerHTML='<main style="font:16px system-ui;text-align:center;padding:12vh 20px"><h1>Page not found</h1><p>That Project page could not be found.</p><a href="/">Back to Project</a></main>';
          })();
          </script></body></html>
          EOF


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
