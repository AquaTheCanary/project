<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff9fa2"><title>Project Ready | Project</title><link rel="stylesheet" href="../assets/files/style.css"><link rel="stylesheet" href="../assets/files/design-system.css"><script src="../assets/files/router.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#20212a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ready-app{min-height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;background:#fff;border-bottom:1px solid #e5e5e9;display:flex;align-items:center;gap:14px;padding:0 18px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750}.brand img{width:30px;height:30px}.name{border:1px solid transparent;background:#f6f6f8;border-radius:8px;padding:9px 11px;font:inherit;font-size:12px;width:220px}.spacer{flex:1}.btn{border:1px solid #e2e2e7;background:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px;cursor:pointer;color:#34343e}.btn.primary{background:#20212a;color:#fff;border-color:#20212a}.btn.ready{background:#fff1f1;border-color:#ff9fa2;color:#b22e38}.layout{flex:1;min-height:0;display:grid;grid-template-columns:205px minmax(0,1fr) minmax(320px,.85fr)}.side{background:#fff;border-right:1px solid #e5e5e9;padding:15px;overflow:auto}.side.right{border-right:0;border-left:1px solid #e5e5e9}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:750;color:#888995;margin:5px 0 12px}.files{display:grid;gap:5px}.file{border:0;background:#fff;text-align:left;padding:10px;border-radius:7px;font-size:11px;cursor:pointer;color:#555662}.file.active{background:#fff0f0;color:#a62e38}.checklist{display:grid;gap:11px;font-size:11px;line-height:1.45}.checklist label{display:flex;gap:8px;align-items:flex-start}.checklist input{margin-top:2px;accent-color:#ff4d57}.center{min-width:0;display:flex;flex-direction:column}.tabs{height:44px;display:flex;align-items:center;gap:5px;padding:0 12px;background:#fff;border-bottom:1px solid #e5e5e9}.tab{border:0;background:transparent;padding:8px 12px;font-size:11px;color:#7b7c86;cursor:pointer;border-radius:6px}.tab.active{background:#fff0f0;color:#b12f39;font-weight:700}.editor{flex:1;min-height:350px;width:100%;resize:none;border:0;outline:none;background:#1e2028;color:#f2f2f5;padding:18px;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.preview-head{height:44px;background:#fff;border-bottom:1px solid #e5e5e9;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:11px;color:#767783}.preview{flex:1;min-height:350px;border:0;background:#fff;width:100%}.footer{height:36px;background:#fff;border-top:1px solid #e5e5e9;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#858691;font-size:10px}.status{font-size:11px;color:#858691}.right-block{margin-bottom:22px}.right-block p{font-size:11px;line-height:1.6;color:#777985}.ready-status{border:1px solid #f0d5d7;background:#fff7f7;border-radius:10px;padding:12px;font-size:11px;line-height:1.6}.ready-status strong{display:block;margin-bottom:4px;color:#a72d37}@media(max-width:900px){.layout{grid-template-columns:165px minmax(0,1fr)}.side.right{grid-column:1/-1;max-height:250px;border-top:1px solid #e5e5e9}.topbar{padding:0 9px;gap:7px}.name{width:140px}.topbar .status{display:none}}@media(max-width:600px){.layout{display:flex;flex-direction:column}.side{max-height:170px;border-bottom:1px solid #e5e5e9}.center{min-height:520px}.side.right{max-height:none}.topbar .brand span{display:none}.name{width:120px}}
</style></head><body><div class="ready-app"><header class="topbar"><a class="brand" href="/"><img src="../assets/images/project-ready.svg" alt=""><span>Project Ready</span></a><input class="name" id="appname" value="Untitled app" aria-label="App name"><span class="status" id="status">Draft saved locally</span><span class="spacer"></span><button class="btn" id="run">▶ Run</button><button class="btn" id="build">Export build</button></header>
<div class="layout"><aside class="side"><div class="eyebrow">PROJECT FILES</div><div class="files"><button class="file active" data-file="html">▤ index.html</button><button class="file" data-file="css">▧ styles.css</button><button class="file" data-file="js">⌘ app.js</button></div><div class="eyebrow" style="margin-top:22px">BUILD CHECKLIST</div><div class="checklist"><label><input type="checkbox" id="check-responsive"> Responsive viewport included</label><label><input type="checkbox" id="check-preview"> Preview tested</label><label><input type="checkbox" id="check-content"> Placeholder content reviewed</label><label><input type="checkbox" id="check-assets"> Assets and links reviewed</label></div><button class="btn ready" id="mark" style="margin-top:14px;width:100%">Check production readiness</button></aside>
<section class="center"><div class="tabs"><button class="tab active" data-file="html">HTML</button><button class="tab" data-file="css">CSS</button><button class="tab" data-file="js">JavaScript</button><span class="spacer"></span><span style="font-size:10px;color:#888">Live code editor</span></div><textarea class="editor" id="code" spellcheck="false" aria-label="Source code editor"></textarea></section>
<section class="center"><div class="preview-head"><span>LIVE PREVIEW</span><span id="preview-status">Ready to run</span></div><iframe class="preview" id="preview" title="Live app preview" sandbox="allow-scripts"></iframe></section>
</div><footer class="footer"><span>Project Ready · Code, run, refine, prepare</span><span id="build-status">No build exported yet</span></footer></div>
<script>
(()=>{const $=id=>document.getElementById(id),key="project_ready_app_v1";const defaults={html:'<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>My app</title>\n</head>\n<body>\n  <main class="app">\n    <p class="eyebrow">YOUR PROJECT</p>\n    <h1>Hello, world.</h1>\n    <p>Build something useful. Change the code and press Run.</p>\n    <button id="action">Try it</button>\n    <p id="result" aria-live="polite"></p>\n  </main>\n</body>\n</html>',css:'* { box-sizing: border-box; }\nbody { margin: 0; font-family: system-ui, sans-serif; color: #20212a; background: #f7f7f9; }\n.app { max-width: 720px; margin: 10vh auto; padding: 40px; background: white; border-radius: 18px; }\n.eyebrow { color: #b22e38; font-size: 12px; font-weight: 700; letter-spacing: .12em; }\nh1 { font-size: clamp(36px, 7vw, 64px); letter-spacing: -.06em; }\nbutton { border: 0; border-radius: 8px; padding: 12px 18px; background: #ff4d57; color: white; font: inherit; cursor: pointer; }',js:'document.querySelector("#action")?.addEventListener("click", () => {\n  document.querySelector("#result").textContent = "Your app is running!";\n});'};let data={...defaults},active="html";try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved){data={...data,...saved.files};$("appname").value=saved.name||"Untitled app"}}catch{}function save(){try{localStorage.setItem(key,JSON.stringify({name:$("appname").value,files:data}));$("status").textContent="Draft saved locally"}catch{$("status").textContent="Local save unavailable"}}function setFile(file){if(active==="html"||active==="css"||active==="js")data[active]=$("code").value;active=file;$("code").value=data[file];document.querySelectorAll("[data-file]").forEach(b=>b.classList.toggle("active",b.dataset.file===file));save()}function build(){let html=data.html;const style="<style>\n"+data.css+"\n</style>";const script="<script>\n"+data.js+"\n<"+"/script>";if(/<\/head>/i.test(html))html=html.replace(/<\/head>/i,style+"\n</head>");else html=style+html;if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,script+"\n</body>");else html+=script;return html}function run(){data[active]=$("code").value;save();$("preview").srcdoc=build();$("preview-status").textContent="Preview refreshed";$("status").textContent="Running preview"}document.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>setFile(b.dataset.file));$("code").addEventListener("input",()=>{data[active]=$("code").value;save();$("preview-status").textContent="Code changed · press Run"});$("appname").oninput=save;$("run").onclick=run;$("build").onclick=()=>{data[active]=$("code").value;save();const blob=new Blob([build()],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=($("appname").value||"project-ready").replace(/[^a-z0-9-_]+/gi,"-")+".html";a.click();URL.revokeObjectURL(a.href);$("build-status").textContent="HTML build exported";$("status").textContent="Build exported"};$("mark").onclick=()=>{const checks=["check-responsive","check-preview","check-content","check-assets"].every(id=>$(id).checked);if(!checks){$("preview-status").textContent="Complete all checklist items first";return}run();$("preview-status").textContent="Checklist complete · ready for your deployment";$("build-status").textContent="Marked ready · export build to deploy";$("status").textContent="Readiness checked"};setFile("html");run()})();
</script></body></html>
